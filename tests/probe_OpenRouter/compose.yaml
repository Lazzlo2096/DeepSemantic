services:
  probe:
    build: .
    environment:
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:-}"
      EMBEDDING_OPENROUTER_MODEL: "${EMBEDDING_OPENROUTER_MODEL:-nvidia/nemotron-3.5-embed-8b:free}"
    volumes:
      - ./results:/results
      - ./data:/data:ro
    command: ["--output", "/results"]
