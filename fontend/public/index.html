<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Статьи arXiv · DeepSemantic</title>
    <meta name="description" content="Каталог статей arXiv, загруженных в DeepSemantic.">
    <link rel="stylesheet" href="/styles.css">
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <header class="topbar">
      <div class="shell brand">
        <span class="brand-mark" aria-hidden="true">DS</span>
        <span>DeepSemantic</span>
      </div>
    </header>

    <main class="shell">
      <section class="intro" aria-labelledby="page-title">
        <p class="eyebrow">Каталог публикаций</p>
        <h1 id="page-title">Статьи arXiv</h1>
        <p>Публикации, загруженные в DeepSemantic. Открой статью, чтобы прочитать её чанки.</p>
        <form id="search-form" class="search-form" role="search">
          <label for="search-query">Поиск по смыслу</label>
          <div class="search-controls">
            <input id="search-query" name="query" type="search" required maxlength="1000"
                   placeholder="Например, как модели запоминают прошлые разговоры">
            <button id="search-submit" type="submit">Найти</button>
          </div>
        </form>
      </section>

      <section id="catalog" aria-labelledby="results-title">
        <div class="results-bar">
          <h2 id="results-title" tabindex="-1">Каталог статей</h2>
          <p id="status" role="status">Загружаем статьи…</p>
        </div>
        <form id="catalog-filters" class="catalog-filters" aria-label="Фильтры каталога">
          <div class="filter-fields">
            <label>
              Сортировка
              <select name="sort">
                <option value="downloaded_desc">Последние загрузки</option>
                <option value="submitted_desc">По дате подачи · новые</option>
                <option value="submitted_asc">По дате подачи · старые</option>
                <option value="status">По этапу обработки</option>
              </select>
            </label>
            <label>
              Статус
              <select name="status">
                <option value="">Все статусы</option>
              </select>
            </label>
            <label>
              Дата подачи с (UTC)
              <input name="date_from" type="date" min="0001-01-01" max="9999-12-31">
            </label>
            <label>
              Дата подачи по (UTC)
              <input name="date_to" type="date" min="0001-01-01" max="9999-12-31">
            </label>
          </div>
          <div class="filter-actions">
            <button type="submit">Применить</button>
            <button id="clear-filters" type="button">Сбросить</button>
          </div>
        </form>
        <button id="retry" type="button" hidden>Повторить загрузку</button>
        <div id="papers" class="paper-list"></div>
        <nav id="pagination" class="pagination" aria-label="Страницы каталога" hidden>
          <button id="previous" type="button">← Назад</button>
          <span id="page-number"></span>
          <button id="next" type="button">Дальше →</button>
        </nav>
      </section>

      <section id="search-results" aria-labelledby="search-title" hidden>
        <div class="results-bar">
          <h2 id="search-title" tabindex="-1">Похожие фрагменты</h2>
          <button id="back-to-catalog" type="button">Вернуться к каталогу</button>
        </div>
        <p id="search-status" role="status"></p>
        <div id="search-chunks" class="paper-list"></div>
      </section>
      <noscript><p>Для загрузки каталога включи JavaScript.</p></noscript>
    </main>

    <template id="paper-template">
      <article class="paper">
        <div class="paper-meta">
          <span class="paper-id"></span>
          <time class="paper-date" title="Дата подачи в UTC"></time>
          <span class="paper-stage"></span>
        </div>
        <h3>
          <a class="paper-title"></a>
          <a class="paper-arxiv" target="_blank" rel="noopener" aria-label="Оригинал на arXiv, новая вкладка" hidden>arXiv ↗</a>
        </h3>
        <p class="paper-authors"></p>
        <details>
          <summary>Аннотация</summary>
          <p class="paper-abstract"></p>
        </details>
      </article>
    </template>

    <template id="search-result-template">
      <article class="paper">
        <div class="paper-meta">
          <span class="search-fragment"></span>
          <span class="paper-stage search-score"></span>
        </div>
        <h3>
          <a class="paper-title search-paper"></a>
          <a class="paper-arxiv" target="_blank" rel="noopener" aria-label="Оригинал на arXiv, новая вкладка" hidden>arXiv ↗</a>
        </h3>
        <p class="search-excerpt"></p>
      </article>
    </template>
  </body>
</html>
