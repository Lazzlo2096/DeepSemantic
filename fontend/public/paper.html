<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Статья arXiv · DeepSemantic</title>
    <link rel="icon" href="/icon.svg" type="image/svg+xml" sizes="any">
    <link rel="stylesheet" href="/styles.css?v=3">
    <link rel="stylesheet" href="/vendor/katex/katex.min.css">
    <script defer src="/vendor/katex/katex.min.js"></script>
    <script defer src="/vendor/texmath.js"></script>
    <script type="module" src="/paper.js"></script>
  </head>
  <body>
    <header class="topbar">
      <div class="shell brand">
        <a class="brand-link" href="/">
          <img class="brand-mark" src="/icon.svg" width="32" height="32" alt="">
          DeepSemantic
        </a>
      </div>
    </header>

    <main class="shell">
      <a id="catalog-back" class="catalog-back" href="/">← Вернуться к каталогу</a>
      <header class="intro">
        <p class="eyebrow" id="paper-id">Статья arXiv</p>
        <h1 id="paper-title">Статья</h1>
        <p id="paper-authors" hidden></p>
        <div class="paper-actions">
          <a id="paper-arxiv" class="paper-arxiv" target="_blank" rel="noopener"
             aria-label="Оригинал на arXiv, новая вкладка" hidden>Оригинал на arXiv ↗</a>
          <a id="paper-html" class="paper-download" download hidden>Скачать HTML</a>
        </div>
      </header>

      <section id="paper-summary" class="paper" aria-labelledby="summary-title" hidden>
        <div class="results-bar">
          <h2 id="summary-title">Суммаризация</h2>
          <button id="summarize" type="button" disabled>Суммаризировать</button>
        </div>
        <p id="summary-status" role="status">Проверяем статус…</p>
        <div id="summary-result" class="formatted-text" hidden></div>
      </section>

      <section id="paper-text" class="paper" aria-labelledby="text-title" hidden>
        <div class="results-bar">
          <h2 id="text-title">Полный текст статьи</h2>
          <p id="text-status" role="status"></p>
        </div>
        <div id="text-result" class="formatted-text" role="region" aria-labelledby="text-title" tabindex="0" hidden></div>
      </section>

      <section aria-labelledby="chunks-title">
        <div class="results-bar">
          <h2 id="chunks-title">Чанки статьи</h2>
          <p id="status" role="status">Загружаем статью…</p>
        </div>
        <div id="paper-chunks" class="paper-list"></div>
      </section>
      <noscript><p>Для загрузки статьи включи JavaScript.</p></noscript>
    </main>

    <template id="chunk-template">
      <article class="paper">
        <h3 class="chunk-heading"></h3>
        <p class="chunk-text"></p>
      </article>
    </template>
  </body>
</html>
