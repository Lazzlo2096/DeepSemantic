<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Public Spaces · DeepSemantic</title>
    <meta name="description" content="Публичные пространства DeepSemantic.">
    <link rel="icon" href="/icon.svg" type="image/svg+xml" sizes="any">
    <link rel="stylesheet" href="/styles.css?v=8">
    <script type="module" src="/auth.js?v=1"></script>
    <script type="module" src="/spaces.js?v=1"></script>
  </head>
  <body>
    <header class="topbar">
      <div class="shell brand">
        <a class="brand-link" href="/">
          <img class="brand-mark" src="/icon.svg" width="32" height="32" alt="">
          DeepSemantic
        </a>
        <nav class="topbar-nav" aria-label="Разделы"></nav>
      </div>
    </header>

    <main class="shell">
      <section class="intro" aria-labelledby="page-title">
        <p class="eyebrow">Открытая библиотека</p>
        <h1 id="page-title">Public Spaces</h1>
        <p>Публичные пространства, которыми авторы поделились со всеми в интернете.</p>
      </section>

      <section aria-labelledby="spaces-title">
        <div class="results-bar">
          <h2 id="spaces-title">Все публичные пространства</h2>
          <p id="spaces-status" role="status">Загружаем пространства…</p>
        </div>
        <p id="spaces-error" role="alert" hidden></p>
        <div id="spaces-list" class="paper-list"></div>
        <p id="spaces-empty" hidden>Публичных пространств пока нет.</p>
      </section>
    </main>
  </body>
</html>
