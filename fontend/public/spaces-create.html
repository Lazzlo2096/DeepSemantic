<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Создать Space · DeepSemantic</title>
    <link rel="icon" href="/icon.svg" type="image/svg+xml" sizes="any">
    <link rel="stylesheet" href="/styles.css?v=10">
    <script type="module" src="/spaces-create.js?v=1"></script>
  </head>
  <body class="space-create-page">
    <header class="topbar">
      <div class="shell brand">
        <a class="brand-link" href="/">
          <img class="brand-mark" src="/icon.svg" width="32" height="32" alt="">
          DeepSemantic
        </a>
        <nav class="topbar-nav" aria-label="Основная навигация"></nav>
        <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="mobile-menu">Меню</button>
        <nav id="mobile-menu" class="mobile-menu" aria-label="Мобильная навигация" hidden></nav>
      </div>
    </header>

    <main class="shell space-create-main">
      <div class="space-create-layout">
        <section class="space-create-panel" aria-labelledby="space-create-form-title">
          <div class="space-create-panel-head">
            <p class="eyebrow">Параметры</p>
            <h2 id="space-create-form-title">Настройте пространство</h2>
          </div>
          <form id="space-create-form">
          <div class="space-create-field-grid">
            <label>
              Название
              <input name="name" type="text" maxlength="300" required autocomplete="off">
            </label>
            <label>
              Доступ
              <select name="visibility">
                <option value="private">Приватный — только приглашённые пользователи</option>
                <option value="public">Public — читать смогут все в интернете</option>
              </select>
            </label>
          </div>
          <label>
            Описание
            <textarea name="description" maxlength="10000" rows="6" placeholder="О чём это пространство?"></textarea>
          </label>
          <div class="filter-actions">
            <button type="submit" id="space-create-submit">Создать Space</button>
            <a class="paper-download" href="/public-spaces.html">Отмена</a>
          </div>
          <p id="space-create-feedback" role="alert" hidden></p>
          </form>
        </section>
      </div>
    </main>
  </body>
</html>
