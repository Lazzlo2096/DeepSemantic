x-host-ollama: &host-ollama "http://host.docker.internal:11434"

services:
  worker-control:
    environment:
      EMBEDDING_WORKER_EXTERNAL: "true"

  ollama:
    profiles: [container-inference]

  ollama-init:
    depends_on: !reset {}
    environment:
      OLLAMA_HOST: *host-ollama

  api:
    environment:
      OLLAMA_URL: *host-ollama

  summary-worker:
    environment:
      OLLAMA_URL: *host-ollama

  embeding-service:
    profiles: [container-inference]

  paper-indexer:
    depends_on:
      embeding-service: !reset null
