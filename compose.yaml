services:
  embeding-service:
    build: ./embeding-service
    ports:
      - "127.0.0.1:${EMBEDDING_PORT:-8000}:8000"
    environment:
      EMBEDDING_MAX_TOKENS: "${EMBEDDING_MAX_TOKENS:-512}"
      EMBEDDING_BATCH_SIZE: "${EMBEDDING_BATCH_SIZE:-8}"
      HF_HUB_DOWNLOAD_TIMEOUT: "${HF_HUB_DOWNLOAD_TIMEOUT:-120}"
    volumes:
      - embedding-model-cache:/var/cache/huggingface
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health', timeout=3).close()"]
      interval: 10s
      timeout: 5s
      start_period: 10m
      retries: 3

volumes:
  embedding-model-cache:
