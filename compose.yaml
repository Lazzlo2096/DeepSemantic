x-amqp-environment: &amqp-environment
  AMQP_URL: "${AMQP_URL:-amqp://deepsemantic:deepsemantic@rebbit:5672/}"

x-postgres-environment: &postgres-environment
  POSTGRES_DB: "${POSTGRES_DB:-deepsemantic}"
  POSTGRES_USER: "${POSTGRES_USER:-deepsemantic}"
  POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-deepsemantic}"

services:
  api:
    build: ./api
    depends_on:
      rebbit:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${EMBEDDING_PORT:-8000}:8000"
    environment:
      <<: [*amqp-environment, *postgres-environment]
      EMBEDDING_RPC_TIMEOUT: "${EMBEDDING_RPC_TIMEOUT:-60}"
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health', timeout=4).close()"]
      interval: 10s
      timeout: 5s
      start_period: 10m
      retries: 3

  embeding-service:
    build: ./embeding-service
    depends_on:
      rebbit:
        condition: service_healthy
    environment:
      <<: *amqp-environment
      EMBEDDING_MAX_TOKENS: "${EMBEDDING_MAX_TOKENS:-512}"
      EMBEDDING_BATCH_SIZE: "${EMBEDDING_BATCH_SIZE:-8}"
      HF_HUB_DOWNLOAD_TIMEOUT: "${HF_HUB_DOWNLOAD_TIMEOUT:-120}"
    volumes:
      - embedding-model-cache:/var/cache/huggingface

  rebbit:
    image: rabbitmq:4.2-management-alpine
    hostname: rebbit
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_DEFAULT_USER:-deepsemantic}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_DEFAULT_PASS:-deepsemantic}"
    volumes:
      - ./rebbit/rabbitmq.conf:/etc/rabbitmq/conf.d/20-deepsemantic.conf:ro
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 3

  qdrant:
    image: qdrant/qdrant:v1.20.0
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage

  postgres:
    image: postgres:17-alpine
    environment: *postgres-environment
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:9.19
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: "${PGADMIN_DEFAULT_EMAIL:-admin@deepsemantic.dev}"
      PGADMIN_DEFAULT_PASSWORD: "${PGADMIN_DEFAULT_PASSWORD:-deepsemantic}"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro

volumes:
  embedding-model-cache:
  rabbitmq-data:
  qdrant-data:
  postgres-data:
  pgadmin-data:
