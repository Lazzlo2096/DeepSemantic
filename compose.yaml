x-amqp-environment: &amqp-environment
  AMQP_URL: "${AMQP_URL:-amqp://deepsemantic:deepsemantic@rebbit:5672/}"

x-postgres-environment: &postgres-environment
  POSTGRES_DB: "${POSTGRES_DB:-deepsemantic}"
  POSTGRES_USER: "${POSTGRES_USER:-deepsemantic}"
  POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-deepsemantic}"

x-rustfs-environment: &rustfs-environment
  RUSTFS_ACCESS_KEY: "${RUSTFS_ACCESS_KEY:-deepsemantic}"
  RUSTFS_SECRET_KEY: "${RUSTFS_SECRET_KEY:-deepsemantic-local}"

x-llm-environment: &llm-environment
  LLM_PROVIDER: "${LLM_PROVIDER:-openrouter}"
  OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:-}"
  OPENROUTER_MODEL: "${OPENROUTER_MODEL:-deepseek/deepseek-v4.1-flash-1017}"
  OLLAMA_MODEL: "${OLLAMA_MODEL:-gemma3:4b}"

x-embedding-client-environment: &embedding-client-environment
  <<: [*amqp-environment, *postgres-environment]
  EMBEDDING_RPC_TIMEOUT: "${EMBEDDING_RPC_TIMEOUT:-60}"
  QDRANT_URL: "${QDRANT_URL:-http://qdrant:6333}"

services:
  fontend:
    image: caddy:2-alpine
    depends_on:
      api:
        condition: service_started
      worker-control:
        condition: service_started
    networks: [default, worker-control]
    ports:
      - "127.0.0.1:${FONTEND_PORT:-8080}:80"
    volumes:
      - ./fontend/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./fontend/public:/srv:ro

  worker-control:
    build:
      context: ./api
      target: worker-control
    environment:
      DEEPSEMANTIC_COMPOSE_PROJECT: "${COMPOSE_PROJECT_NAME}"
    networks: [worker-control]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  api:
    build: ./api
    depends_on:
      rebbit:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      qdrant:
        condition: service_started
    ports:
      - "127.0.0.1:${EMBEDDING_PORT:-8000}:8000"
    environment:
      <<: [*embedding-client-environment, *llm-environment]
      RUSTFS_BUCKET: "${RUSTFS_BUCKET:-arxiv-papers}"
      RAG_OLLAMA_GPU_LAYERS: "${RAG_OLLAMA_GPU_LAYERS:--1}"
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health/live', timeout=4).close()"]
      interval: 10s
      timeout: 5s
      start_period: 10m
      retries: 3

  paper-indexer:
    profiles: [workers]
    build: ./api
    command: ["python", "-m", "paper_embeddings", "--watch"]
    restart: unless-stopped
    depends_on:
      rebbit:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      qdrant:
        condition: service_started
      embeding-service:
        condition: service_started
    environment: *embedding-client-environment

  summary-worker:
    profiles: [workers]
    build:
      context: .
      dockerfile: summary-worker/Dockerfile
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      ollama-init:
        condition: service_completed_successfully
      rustfs:
        condition: service_healthy
    environment:
      <<: [*postgres-environment, *rustfs-environment, *llm-environment]
      RUSTFS_ENDPOINT: http://rustfs:9000
      SUMMARY_CONTEXT_TOKENS: "${SUMMARY_CONTEXT_TOKENS:-49152}"

  embeding-service:
    profiles: [workers]
    build: ./embeding-service
    depends_on:
      rebbit:
        condition: service_healthy
    environment:
      <<: *amqp-environment
      EMBEDDING_MAX_TOKENS: "${EMBEDDING_MAX_TOKENS:-512}"
      EMBEDDING_BATCH_SIZE: "${EMBEDDING_BATCH_SIZE:-8}"
      HF_HUB_DOWNLOAD_TIMEOUT: "${HF_HUB_DOWNLOAD_TIMEOUT:-120}"
    volumes:
      - embedding-model-cache:/var/cache/huggingface

  ollama:
    extends:
      file: ./ollama/compose.yaml
      service: ollama

  ollama-init:
    extends:
      file: ./ollama/compose.yaml
      service: ollama-init
    environment:
      LLM_PROVIDER: "${LLM_PROVIDER:-openrouter}"
    depends_on:
      ollama:
        condition: service_healthy

  rebbit:
    image: rabbitmq:4.2-management-alpine
    hostname: rebbit
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_DEFAULT_USER:-deepsemantic}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_DEFAULT_PASS:-deepsemantic}"
    volumes:
      - ./rebbit/rabbitmq.conf:/etc/rabbitmq/conf.d/20-deepsemantic.conf:ro
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 3

  qdrant:
    image: qdrant/qdrant:v1.20.0
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage

  postgres:
    image: postgres:17-alpine
    environment: *postgres-environment
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build: ./postgres/migrations
    depends_on:
      postgres:
        condition: service_healthy
    environment: *postgres-environment

  pgadmin:
    image: dpage/pgadmin4:9.19
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: "${PGADMIN_DEFAULT_EMAIL:-admin@deepsemantic.dev}"
      PGADMIN_DEFAULT_PASSWORD: "${PGADMIN_DEFAULT_PASSWORD:-deepsemantic}"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro

  rustfs:
    image: rustfs/rustfs:1.0.4
    command: ["/data"]
    environment:
      <<: *rustfs-environment
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "127.0.0.1:${RUSTFS_API_PORT:-9000}:9000"
      - "127.0.0.1:${RUSTFS_CONSOLE_PORT:-9001}:9001"
    volumes:
      - rustfs-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 12

  arxiv-grabber:
    profiles: [workers]
    build: ./arxiv-grabber
    command: ["--worker"]
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      rustfs:
        condition: service_healthy
    environment:
      <<: [*postgres-environment, *rustfs-environment]
      RUSTFS_ENDPOINT: http://rustfs:9000
      RUSTFS_BUCKET: "${RUSTFS_BUCKET:-arxiv-papers}"
      ARXIV_SOURCE_FORMAT: "${ARXIV_SOURCE_FORMAT:-html}"

  arxiv-text-worker:
    profiles: [workers]
    build: ./arxiv-grabber
    entrypoint: ["python", "text_worker.py"]
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      rustfs:
        condition: service_healthy
    environment:
      <<: [*postgres-environment, *rustfs-environment]
      RUSTFS_ENDPOINT: http://rustfs:9000

  loki:
    image: grafana/loki:3.7.0
    command: ["-config.file=/etc/loki/config.yaml"]
    restart: unless-stopped
    volumes:
      - ./observability/loki.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki

  alloy:
    image: grafana/alloy:v1.21.3
    command: ["run", "--storage.path=/var/lib/alloy/data", "/etc/alloy/config.alloy"]
    restart: unless-stopped
    depends_on:
      loki:
        condition: service_started
    environment:
      DEEPSEMANTIC_COMPOSE_PROJECT: "${COMPOSE_PROJECT_NAME}"
    volumes:
      - ./observability/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data

  grafana:
    image: grafana/grafana:13.3.0
    restart: unless-stopped
    depends_on:
      loki:
        condition: service_started
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:-deepsemantic}"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_PLUGINS_PREINSTALL_SYNC: "yesoreyeram-infinity-datasource@4.1.6"
    volumes:
      - ./observability/grafana-datasources.yaml:/etc/grafana/provisioning/datasources/loki.yaml:ro
      - ./observability/grafana-dashboards.yaml:/etc/grafana/provisioning/dashboards/deepsemantic.yaml:ro
      - ./observability/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana

  # qryn-view:
  #   build: ./observability/qryn-view
  #   restart: unless-stopped
  #   depends_on:
  #     loki:
  #       condition: service_started
  #   ports:
  #     - "127.0.0.1:${QRYN_VIEW_PORT:-3101}:80"

networks:
  worker-control:
    internal: true

volumes:
  embedding-model-cache:
  ollama-model-cache:
  rabbitmq-data:
  qdrant-data:
  postgres-data:
  pgadmin-data:
  rustfs-data:
  loki-data:
  alloy-data:
  grafana-data:
