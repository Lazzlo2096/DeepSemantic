x-amqp-environment: &amqp-environment
  AMQP_URL: "${AMQP_URL:-amqp://deepsemantic:deepsemantic@rebbit:5672/}"

services:
  api:
    build: ./api
    depends_on:
      rebbit:
        condition: service_healthy
    ports:
      - "127.0.0.1:${EMBEDDING_PORT:-8000}:8000"
    environment:
      <<: *amqp-environment
      EMBEDDING_RPC_TIMEOUT: "${EMBEDDING_RPC_TIMEOUT:-60}"
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health', timeout=4).close()"]
      interval: 10s
      timeout: 5s
      start_period: 10m
      retries: 3

  embeding-service:
    build: ./embeding-service
    depends_on:
      rebbit:
        condition: service_healthy
    environment:
      <<: *amqp-environment
      EMBEDDING_MAX_TOKENS: "${EMBEDDING_MAX_TOKENS:-512}"
      EMBEDDING_BATCH_SIZE: "${EMBEDDING_BATCH_SIZE:-8}"
      HF_HUB_DOWNLOAD_TIMEOUT: "${HF_HUB_DOWNLOAD_TIMEOUT:-120}"
    volumes:
      - embedding-model-cache:/var/cache/huggingface

  rebbit:
    image: rabbitmq:4.2-alpine
    hostname: rebbit
    environment:
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_DEFAULT_USER:-deepsemantic}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_DEFAULT_PASS:-deepsemantic}"
    volumes:
      - ./rebbit/rabbitmq.conf:/etc/rabbitmq/conf.d/20-deepsemantic.conf:ro
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 3

volumes:
  embedding-model-cache:
  rabbitmq-data:
