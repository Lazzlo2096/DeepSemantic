services:
  ollama:
    image: &ollama-image ollama/ollama:0.40.15
    restart: unless-stopped
    ports:
      - "127.0.0.1:${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama-model-cache:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 3s
      retries: 12

  ollama-init:
    image: *ollama-image
    restart: "on-failure:5"
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: "${OLLAMA_MODEL:-gemma3:4b}"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        if [ "$${LLM_PROVIDER:-ollama}" != ollama ]; then
          exit 0
        fi
        if ! ollama show "$$OLLAMA_MODEL" >/dev/null 2>&1; then
          exec ollama pull "$$OLLAMA_MODEL"
        fi
